services:
  app:
    image: mikoto2000/tauri2
    volumes:
      - ./:/workspaces
    ports:
      - 8080:8080
    command: ['sh', '-c',  'trap "exit 0" TERM; sleep infinity & wait']
  postgres:
    image: postgres:18
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./db/ddl:/docker-entrypoint-initdb.d
    environment:
      POSTGRES_DB: public
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - 0.0.0.0:5432:5432

volumes:
  postgres_data:
