spring:
  application:
    name: maitta
  datasource:
    url: ${MAITTA_DB_URL:jdbc:postgresql://postgres:5432/public}
    username: ${MAITTA_DB_USERNAME:admin}
    password: ${MAITTA_DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    url: ${MAITTA_DB_URL:jdbc:postgresql://postgres:5432/public}
    user: ${MAITTA_DB_USERNAME:admin}
    password: ${MAITTA_DB_PASSWORD:password}
    schemas: ${MAITTA_DB_SCHEMA:public}
    default-schema: ${MAITTA_DB_SCHEMA:public}
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${MAITTA_GITHUB_CLIENT_ID:}
            client-secret: ${MAITTA_GITHUB_CLIENT_SECRET:}
            scope:
              - read:user
              - user:email

server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        same-site: none
        secure: true

app:
  cors:
    enabled: true
    allowed-origins: ${MAITTA_ALLOWED_ORIGINS:http://localhost:1420}
    allow-credentials: true
  security:
    oauth2:
      frontend-success-url: ${MAITTA_FRONTEND_SUCCESS_URL:http://localhost:1420/}

logging:
  level:
    org.springframework.security.oauth2.client: DEBUG
    org.springframework.security.oauth2.core: DEBUG
    org.springframework.web.client.RestTemplate: DEBUG

