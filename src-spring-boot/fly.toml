app = "maitta-api"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[env]
  SERVER_PORT = "8080"
  MAITTA_ALLOWED_ORIGINS = "https://maitta.pages.dev"
  MAITTA_FRONTEND_SUCCESS_URL = "https://maitta.pages.dev/"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
